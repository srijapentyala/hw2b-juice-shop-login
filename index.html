<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | OWASP Juice Shop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="mark" aria-hidden="true"></span>
    <span>OWASP Juice Shop</span>
  </header>

  <main>
    <form id="login-form" novalidate>
      <h1>Login</h1>
      <label for="email">Email</label>
      <input id="email" name="email" type="text" autocomplete="username" maxlength="200">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200">

      <button id="login-button" type="submit">Log in</button>
      <p id="message" role="status"></p>
      <p id="submitted"></p>
    </form>
  </main>

  <script src="/login.js"></script>
</body>
</html>
